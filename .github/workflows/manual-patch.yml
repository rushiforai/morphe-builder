name: 1. Manual Patch

permissions: write-all

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Patch source repo from archive manifest, or all"
        required: true
        default: "rushiranpise/morphe-patches"
        type: string
      chunk_size:
        description: "Builds per matrix job when source_repo is all"
        required: true
        default: "10"
        type: string
      max_parallel:
        description: "Maximum parallel builds for free account"
        required: true
        default: "20"
        type: string
      source_order:
        description: "APK resolver source order"
        required: true
        default: "apkmirror uptodown apkpure apkcombo"
        type: string
  workflow_call:
    inputs:
      source_repo:
        required: true
        type: string
      chunk_size:
        required: false
        default: "10"
        type: string
      max_parallel:
        required: false
        default: "20"
        type: string
      source_order:
        required: false
        default: "apkmirror uptodown apkpure apkcombo"
        type: string

jobs:
  build-source:
    if: ${{ inputs.source_repo != 'all' }}
    uses: ./.github/workflows/archive-build-source.yml
    secrets: inherit
    with:
      source_repo: ${{ inputs.source_repo }}
      max_parallel: ${{ inputs.max_parallel }}
      source_order: ${{ inputs.source_order }}

  build-all:
    if: ${{ inputs.source_repo == 'all' }}
    uses: ./.github/workflows/archive-build-all.yml
    secrets: inherit
    with:
      source_repo: all
      chunk_size: ${{ inputs.chunk_size }}
      max_parallel: ${{ inputs.max_parallel }}
      source_order: ${{ inputs.source_order }}
