name: 2. Check new patch

permissions: write-all

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      max_parallel:
        description: "Maximum parallel builds for free account"
        required: true
        default: "20"
        type: string
      source_order:
        description: "APK resolver source order"
        required: true
        default: "apkmirror uptodown apkpure apkcombo"
        type: string
      force_all:
        description: "Build all sources even if no update is detected"
        required: true
        default: false
        type: boolean

jobs:
  check:
    name: Select changed archive sources
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      sources: ${{ steps.sources.outputs.sources }}
      count: ${{ steps.sources.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Generate latest archive manifest
        run: python scripts/generate_archive_manifest.py

      - name: Select sources to build
        id: sources
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_ALL: ${{ inputs.force_all && 'true' || 'false' }}
        run: python scripts/select_changed_archive_sources.py

      - name: Summary
        run: |
          {
            echo "### Archive patch check"
            echo ""
            echo "Sources selected: ${{ steps.sources.outputs.count }}"
            echo ""
            echo '${{ steps.sources.outputs.sources }}'
          } >> "$GITHUB_STEP_SUMMARY"

  patch:
    name: Patch ${{ matrix.source_repo }}
    needs: check
    if: ${{ fromJSON(needs.check.outputs.count) > 0 }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel || '20') }}
      matrix:
        source_repo: ${{ fromJSON(needs.check.outputs.sources) }}
    uses: ./.github/workflows/archive-build-source.yml
    secrets: inherit
    with:
      source_repo: ${{ matrix.source_repo }}
      max_parallel: "1"
      source_order: ${{ inputs.source_order || 'apkmirror uptodown apkpure apkcombo' }}
