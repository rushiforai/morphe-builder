name: Archive Build

permissions: write-all

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Build id from src/archive/build-manifest.json"
        required: true
        type: string
      source_order:
        description: "APK resolver source order"
        required: true
        default: "apkmirror uptodown apkpure apkcombo gplay"
        type: string

jobs:
  build:
    name: Build archive app/source
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Preparing to patch
        uses: ./.github/actions/preparing

      - name: Build archive entry
        env:
          APK_SOURCE_ORDER: ${{ inputs.source_order }}
          RELEASE_TAG_OVERRIDE: archive-build-${{ github.run_number }}
        run: bash src/build/archive-entry.sh "${{ inputs.build_id }}"

      - name: Publish run release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_env=$(find .work/archive-build -name release.env | head -1)
          if [ -z "$release_env" ]; then
            echo "release.env not found" >&2
            exit 1
          fi
          bash src/build/publish-archive-release.sh "$release_env"
