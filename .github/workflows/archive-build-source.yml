name: Archive Build Source

permissions: write-all

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Patch source repo from src/archive/build-manifest.json"
        required: true
        default: "rushiranpise/morphe-patches"
        type: string
      max_parallel:
        description: "Maximum parallel builds for free account"
        required: true
        default: "20"
        type: string
      source_order:
        description: "APK resolver source order"
        required: true
        default: "apkmirror uptodown apkpure apkcombo"
        type: string

jobs:
  matrix:
    name: Prepare source build matrix
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      build_ids: ${{ steps.matrix.outputs.build_ids }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Build matrix
        id: matrix
        shell: bash
        env:
          SOURCE_REPO: ${{ inputs.source_repo }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path

          source_repo = os.environ["SOURCE_REPO"]
          manifest = json.loads(Path("src/archive/build-manifest.json").read_text(encoding="utf-8"))
          build_ids = [
              item["id"]
              for item in manifest.get("builds", [])
              if item.get("sourceRepo", "").lower() == source_repo.lower()
          ]
          if not build_ids:
              raise SystemExit(f"No builds found for source repo: {source_repo}")
          if len(build_ids) > 256:
              raise SystemExit(f"{source_repo} has {len(build_ids)} builds; GitHub matrix limit is 256")
          print(f"build_ids={json.dumps(build_ids)}")
          print(f"count={len(build_ids)}")
          PY

  build:
    name: Build ${{ matrix.build_id }}
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 360
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        build_id: ${{ fromJSON(needs.matrix.outputs.build_ids) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Preparing to patch
        uses: ./.github/actions/preparing

      - name: Build archive entry
        id: build
        continue-on-error: true
        env:
          APK_SOURCE_ORDER: ${{ inputs.source_order }}
          RELEASE_TAG_OVERRIDE: archive-build-${{ github.run_number }}
        run: bash src/build/archive-entry.sh "${{ matrix.build_id }}"

      - name: Publish run release
        if: steps.build.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_env=$(find .work/archive-build -name release.env | head -1)
          if [ -z "$release_env" ]; then
            echo "release.env not found" >&2
            exit 1
          fi
          bash src/build/publish-archive-release.sh "$release_env"
